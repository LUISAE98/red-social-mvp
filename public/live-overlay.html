<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Live Overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent !important;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #root { padding: 0 12px 12px; }

    #card {
      background: #0a0a0a;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrap { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
    .avatar-inner {
      position: absolute; inset: 4px; border-radius: 50%; overflow: hidden;
      background: rgba(168,85,247,0.5);
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-initial { font-size: 22px; color: #fff; font-weight: 700; }
    .avatar-ring { position: absolute; inset: 0; border-radius: 50%; }

    .info { flex: 1; min-width: 0; }
    .username { font-size: 20px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
    .amount .label { color: rgba(255,255,255,0.5); font-size: 15px; }
    .amount .value { color: #4ade80; font-weight: 700; font-size: 15px; }

    .sc-in  { animation: obsScIn  0.4s ease forwards; }
    .sc-out { animation: obsScOut 0.7s ease forwards; }

    @keyframes obsScIn  { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }
    @keyframes obsScOut { from { opacity:1; transform:translateY(0) }    to { opacity:0; transform:translateY(6px) } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp }         from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const params = new URLSearchParams(location.search);
    const postId = params.get("postId");
    // Token del Browser Source: autentica el aviso de "ya lo estoy mostrando".
    // Si falta, el panel del creador sigue funcionando por su fallback de 1.5s.
    const overlayToken = params.get("t");
    if (!postId) { console.error("[overlay] falta postId"); }
    if (!overlayToken) { console.warn("[overlay] URL sin token — copia de nuevo la URL del Browser Source"); }

    const VOICE = "es-MX-DaliaNeural";
    const RING  = 3;

    let prevKey      = null;
    let ttsAudio     = null;
    let overlayTimer = null;
    let fadeTimer    = null;

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    function stopTTS() {
      if (!ttsAudio) return;
      ttsAudio.pause(); ttsAudio.src = ""; ttsAudio = null;
    }

    function fadeOutCard() {
      stopTTS();
      clearTimeout(overlayTimer);
      if (fadeTimer) return;
      const card = document.getElementById("card");
      if (card) { card.className = "sc-out"; }
      fadeTimer = setTimeout(() => {
        document.getElementById("root").innerHTML = "";
        fadeTimer = null;
      }, 700);
    }

    function showCard(sc) {
      stopTTS();
      clearTimeout(overlayTimer);
      clearTimeout(fadeTimer);
      fadeTimer = null;

      const color = esc(sc.color || "#a855f7");
      const amount = Number(sc.amount || 0).toFixed(2);
      const mask = `radial-gradient(farthest-side, transparent calc(100% - ${RING}px), white calc(100% - ${RING}px))`;

      const avatarInner = sc.avatarUrl
        ? `<img src="${esc(sc.avatarUrl)}" alt="">`
        : `<span class="avatar-initial">${esc((sc.username||"?").charAt(0).toUpperCase())}</span>`;

      document.getElementById("root").innerHTML = `
        <div id="card" class="sc-in" style="border-left:4px solid ${color}">
          <div class="avatar-wrap">
            <div class="avatar-inner">${avatarInner}</div>
            <div class="avatar-ring" style="background:${color};-webkit-mask-image:${mask};mask-image:${mask}"></div>
          </div>
          <div class="info">
            <div class="username">${esc(sc.username)}</div>
            <div class="amount">
              <span class="label">donó </span>
              <span class="value">$${esc(amount)} MXN</span>
            </div>
          </div>
        </div>`;

      const durationSecs = sc.displaySeconds || 10;

      if (durationSecs >= 4) {
        const text = `${sc.username} dijo: ${sc.text}`;
        ttsAudio = new Audio(`/api/tts?text=${encodeURIComponent(text)}&voice=${encodeURIComponent(VOICE)}`);
        ttsAudio.volume = 1;
        ttsAudio.play().catch(() => {});
      }

      overlayTimer = setTimeout(fadeOutCard, durationSecs * 1000);
    }

    // Obtener config de Firebase desde nuestro servidor y conectar
    const cfg = await fetch("/api/live-overlay-config").then(r => r.json());
    const app = initializeApp(cfg);
    const db  = getFirestore(app);

    onSnapshot(doc(db, "liveOverlays", postId), (snap) => {
      const sc  = snap.exists() ? (snap.data()?.activeSuper ?? null) : null;
      const key = sc ? `${sc.id}:${sc.scheduledAt ?? 0}` : null;
      if (key === prevKey) return;
      prevKey = key;

      if (!sc) { fadeOutCard(); return; }
      showCard(sc);
      // Señalar al panel del creador que OBS ya está mostrando el SC
      if (overlayToken) {
        fetch("/api/live-overlay-ready", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ postId, scheduledAt: sc.scheduledAt ?? Date.now(), token: overlayToken }),
        }).catch(() => {});
      }
    });
  </script>
</body>
</html>
