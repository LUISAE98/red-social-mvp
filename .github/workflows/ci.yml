name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "dummy"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dummy"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "dummy"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "dummy"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "dummy"
      NEXT_PUBLIC_FIREBASE_APP_ID: "dummy"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Java (emulador de Firestore)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Unit tests (frontend — dinero puro)
        run: npm test

      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Unit tests (backend — ledger, firma MP, reconcile, Connect)
        run: npm test --prefix backend

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15

      - name: Integration tests (emulador — idempotencia del ledger)
        run: npm run test:emulator

      - name: Rules tests (emulador — seguridad de membresías)
        run: npm run test:rules

      - name: Build project
        run: npm run build
